services:
  postgres:
    image: postgres:16-alpine
    container_name: prueba_analitica
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_DB: prueba_pandas_analitica
      POSTGRES_PASSWORD: 123456
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d prueba_pandas_analitica"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: